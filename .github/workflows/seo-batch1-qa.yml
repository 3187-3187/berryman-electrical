name: Batch 1 SEO page browser QA

on:
  push:
    branches:
      - seo-batch1-service-pages-20261023
    paths:
      - 'services/**'
      - 'assets/**'
      - '.github/qa/seo-batch1-qa.cjs'
      - '.github/workflows/seo-batch1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --prefix /tmp/berryman-batch1-qa --no-save playwright
      - name: Install Chromium
        run: /tmp/berryman-batch1-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve website locally without publishing
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/berryman-batch1.log 2>&1 &
          sleep 2
      - name: Test all four pages on mobile, tablet and desktop
        run: NODE_PATH=/tmp/berryman-batch1-qa/node_modules node .github/qa/seo-batch1-qa.cjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-batch1-screenshots
          path: qa-output/seo-batch1/
          retention-days: 14
